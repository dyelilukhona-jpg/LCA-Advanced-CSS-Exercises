<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Showcase</title>
    <link rel="stylesheet" href="week5_ex01_style.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Product Showcase</h1>
      <p>Explore our featured products and add them to your cart.</p>
    </header>

    <main class="product-showcase">
      <section class="product-grid">
        <article class="product-card">
          <img
            src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=600&q=80"
            alt="T-shirt"
          />
          <h2>Tees</h2>
          <p class="product-price">$89</p>
          <button class="add-to-cart">Add To Cart</button>
        </article>

        <article class="product-card">
          <img
            src="https://images.unsplash.com/photo-1581291519195-ef11498d1cf5?auto=format&fit=crop&w=600&q=80"
            alt="Smart Watch"
          />
          <h2>Smart Watch</h2>
          <p class="product-price">$129</p>
          <button class="add-to-cart">Add To Cart</button>
        </article>

        <article class="product-card">
          <img
            src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80"
            alt="Camera"
          />
          <h2>Portable Camera</h2>
          <p class="product-price">$75</p>
          <button class="add-to-cart">Add To Cart</button>
        </article>

        <article class="product-card">
          <img
            src="https://images.unsplash.com/photo-1491553895911-0055eca6402d?auto=format&fit=crop&w=600&q=80"
            alt="Sneakers"
          />
          <h2>Sneakers</h2>
          <p class="product-price">$59</p>
          <button class="add-to-cart">Add To Cart</button>
        </article>

        <article class="product-card">
          <img
            src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=600&q=80"
            alt="Laptop"
          />
          <h2>Laptops</h2>
          <p class="product-price">$120</p>
          <button class="add-to-cart">Add To Cart</button>
        </article>

        <article class="product-card">
          <img
            src="https://images.unsplash.com/photo-1511988617509-a57c8a288659?auto=format&fit=crop&w=600&q=80"
            alt="Sunglasses"
          />
          <h2>Premium Sunglasses</h2>
          <p class="product-price">$45</p>
          <button class="add-to-cart">Add To Cart</button>
        </article>
      </section>
    </main>
  </body>
</html>
